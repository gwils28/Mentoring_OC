[project]
name = "agrireco"
version = "0.1.0"
description = "Prédiction de rendement et recommandation de cultures (FAO), suivi MLflow, API FastAPI, interface Streamlit, CI/CD — corrigé et supports de mentorat OpenClassrooms (DSML P12)"
readme = "README.md"
authors = [
    { name = "wilson goma", email = "10559068+gwils28@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
agrireco = "agrireco.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "websocket-client>=1.9.2",
]
front = [
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]
train = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
]

[tool.uv]
default-groups = ["dev", "train", "api", "front"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Gabarit HTML du rapport : des lignes de texte, pas du code
"scripts/rapport_metier.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
