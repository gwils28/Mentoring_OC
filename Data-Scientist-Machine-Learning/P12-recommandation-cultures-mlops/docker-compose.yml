# L'API et l'interface ensemble : `docker compose up --build`, puis http://localhost:8501
services:
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    ports: ["8000:8000"]
  app:
    build: {context: ., dockerfile: app/Dockerfile}
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}
